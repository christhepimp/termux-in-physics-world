[package]
name = "termux-in-physics-world"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.15", default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "default_font",
    "x11",
] }
bevy_rapier3d = { version = "0.28", features = ["simd-stable"] }
portable-pty = "0.8"
std-mutex = "0.1"

[[bin]]
name = "termux-world"
path = "src/main.rs"
