[package]
name = "termux-in-physics-world"
version = "0.4.0"
edition = "2021"

[dependencies]
bevy = { version = "0.15", default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "default_font",
    "x11",
    "png",
] }
bevy_rapier3d = { version = "0.28", features = ["simd-stable"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[[bin]]
name = "termux-world"
path = "src/main.rs"
