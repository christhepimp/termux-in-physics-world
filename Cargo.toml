[package]
name = "termux-in-physics-world"
version = "0.5.0"
edition = "2021"

[dependencies]
bevy = { version = "0.15", default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "default_font",
    "png",
] }
bevy_rapier3d = { version = "0.28", features = ["simd-stable"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
bevy = { version = "0.15", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "android"))'.dependencies]
# JNI hooks for in-process Android path (optional until fully bound)
# jni = "0.21"

[[bin]]
name = "termux-world"
path = "src/main.rs"

[package.metadata.android]
package = "com.vce.termuxworld"
apk_name = "TermuxPhysicsWorld"
